name: control_my_server_bot
arch: amd64
platform: linux
version: 1.0.3
section: default
priority: extra
maintainer: Edwin Ludik <edwin.ludik@gmail.com>
description: |
  A Telegram bot to control your Linux server.
  Allows restarting the server, services, and checking status.
vendor: Edwin Ludik <edwin.ludik@gmail.com>
homepage: https://github.com/edwinludik/control_my_server_bot
license: MIT

contents:
  - src: control_my_server_bot
    dst: /opt/control_my_server_bot/control_my_server_bot
  - src: control_my_server_bot.service
    dst: /usr/lib/systemd/system/control_my_server_bot.service
    # This path is standard for Arch and RPM
    packager: archlinux
  - src: control_my_server_bot.service
    dst: /usr/lib/systemd/system/control_my_server_bot.service
    # This path is standard for Arch and RPM
    packager: rpm
  - src: control_my_server_bot.service
    dst: /lib/systemd/system/control_my_server_bot.service
    # This path is standard for Debian
    packager: deb
  - src: .env.example
    dst: /opt/control_my_server_bot/.env
    type: config

scripts:
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh

overrides:
  deb:
    depends:
      - systemd
    recommends:
      - procps
  rpm:
    depends:
      - systemd
  archlinux:
    depends:
      - systemd
