name: control_my_server_bot
arch: amd64
platform: linux
version: 1.0.0
section: default
priority: extra
maintainer: Junie <junie@jetbrains.com>
description: |
  A Telegram bot to control your Linux server.
  Allows restarting the server, services, and checking status.
vendor: JetBrains
homepage: https://github.com/example/control_my_server_bot
license: MIT

contents:
  - src: control_my_server_bot
    dst: /usr/bin/control_my_server_bot
  - src: control-bot.service
    dst: /usr/lib/systemd/system/control_my_server_bot.service
  - src: .env.example
    dst: /etc/control_my_server_bot/.env
    type: config

scripts:
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh

overrides:
  deb:
    contents:
      - src: control-bot.service
        dst: /lib/systemd/system/control_my_server_bot.service
    depends:
      - systemd
    recommends:
      - procps
  rpm:
    depends:
      - systemd
  archlinux:
    depends:
      - systemd
