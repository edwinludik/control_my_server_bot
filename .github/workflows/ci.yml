name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: |
          VERSION=$(cat VERSION)
          go build -v -ldflags "-X main.AppVersion=$VERSION" -o control_my_server_bot ./src

      - name: Run Tests
        run: go test -v ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          make packages
          sha256sum control_my_server_bot *.deb *.rpm *.pkg.tar.zst > checksums.txt

      - name: Tag Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=v$(cat VERSION)
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            control_my_server_bot
            checksums.txt
            *.deb
            *.rpm
            *.pkg.tar.zst
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            control_my_server_bot
            checksums.txt
            *.deb
            *.rpm
            *.pkg.tar.zst
          generate_release_notes: true