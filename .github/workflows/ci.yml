name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: go build -v ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build_packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build packages
        run: make packages

      - name: Upload Debian package
        uses: actions/upload-artifact@v5
        with:
          name: deb-package
          path: "*.deb"
          if-no-files-found: error

      - name: Upload RPM package
        uses: actions/upload-artifact@v5
        with:
          name: rpm-package
          path: "*.rpm"
          if-no-files-found: error

      - name: Upload Arch package
        uses: actions/upload-artifact@v5
        with:
          name: arch-package
          path: "*.pkg.tar.zst"
          if-no-files-found: error
