name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build
        run: |
          VERSION=$(cat VERSION)
          go build -v -ldflags "-X main.AppVersion=$VERSION" -o control_my_server_bot ./src

      - name: Run Tests
        run: go test -v ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

  release:
    name: Release
    needs: build
    # Every push to main cuts a release; pushing a v* tag by hand still works too.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Manually pushed tag: release exactly that version.
            version="${GITHUB_REF_NAME#v}"
          else
            # Push to main: release VERSION if it is untagged, else bump the minor version.
            version=$(scripts/next_version.sh)
          fi
          echo "$version" > VERSION
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Build packages
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          make packages
          sha256sum control_my_server_bot *.deb *.rpm *.pkg.tar.zst > checksums.txt

      - name: Commit version and tag
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "chore: release v${VERSION} [skip ci]"
          fi
          git tag "v${VERSION}"
          # Atomic: either both the version commit and the tag land, or neither.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${VERSION}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            control_my_server_bot
            checksums.txt
            *.deb
            *.rpm
            *.pkg.tar.zst
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            control_my_server_bot
            checksums.txt
            *.deb
            *.rpm
            *.pkg.tar.zst
          generate_release_notes: true
